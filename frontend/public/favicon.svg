<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#090B0F" />
    </linearGradient>

    <!-- Electric Orange Tag -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF2B00" />
    </linearGradient>
  </defs>

  <!-- 1. Background Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#252C3D" stroke-width="12" />

  <!-- 2. Main Price Tag Silhouette -->
  <!-- Tag points left-up, flat right-down -->
  <path 
    d="M 140 230 
       L 230 140 
       A 20 20 0 0 1 245 134 
       L 394 134 
       A 20 20 0 0 1 414 154 
       L 414 303 
       A 20 20 0 0 1 408 318 
       L 318 408 
       A 28 28 0 0 1 278 408 
       L 140 270 
       A 28 28 0 0 1 140 230 Z" 
    fill="url(#tagGrad)" 
    stroke="#FFFFFF" 
    stroke-width="16" 
    stroke-linejoin="round"
  />

  <!-- Tag Eyelet Circle (Hole for String) -->
  <circle cx="352" cy="196" r="24" fill="#090B0F" stroke="#FFFFFF" stroke-width="12" />

  <!-- 3. Unmistakable Price Drop Downward Arrow (Pure Bold Vector) -->
  <path 
    d="M 210 240 L 290 320" 
    stroke="#FFFFFF" 
    stroke-width="32" 
    stroke-linecap="round" 
  />
  <polyline 
    points="220,320 290,320 290,250" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="32" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- 4. Top-Right Active Radar Pulse Dot -->
  <circle cx="434" cy="78" r="14" fill="#00E676" stroke="#FFFFFF" stroke-width="4" />
</svg>
