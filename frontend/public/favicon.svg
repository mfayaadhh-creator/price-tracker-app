<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#080A0E" />
    </linearGradient>

    <!-- Vibrant Tag Orange Gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5511" />
      <stop offset="100%" stop-color="#FF2E00" />
    </linearGradient>

    <!-- Mint Green Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFAA" />
      <stop offset="100%" stop-color="#00D288" />
    </linearGradient>

    <!-- Soft Drop Shadow for Badge -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Dark Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#222836" stroke-width="8" />

  <!-- 2. Main Price Tag (Diagonal 45 degrees, pointed top-left, flat bottom-right) -->
  <g>
    <!-- Tag Outer White Border & Body -->
    <path 
      d="M 124 230 
         L 230 124 
         A 20 20 0 0 1 245 118 
         L 396 118 
         A 22 22 0 0 1 418 140 
         L 418 291 
         A 20 20 0 0 1 412 306 
         L 306 412 
         A 28 28 0 0 1 266 412 
         L 124 270 
         A 28 28 0 0 1 124 230 Z" 
      fill="url(#tagGrad)" 
      stroke="#FFFFFF" 
      stroke-width="18" 
      stroke-linejoin="round"
    />

    <!-- Tag String Eyelet Circle (Top-Left) -->
    <circle cx="162" cy="180" r="24" fill="#080A0E" stroke="#FFFFFF" stroke-width="12" />

    <!-- 3. Connected Price Drop Nodes & Downward Trend Line -->
    <!-- Node 1 -->
    <circle cx="160" cy="244" r="12" fill="#FFFFFF" />
    
    <!-- Segment 1 -->
    <line x1="160" y1="244" x2="216" y2="300" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <!-- Node 2 -->
    <circle cx="216" cy="300" r="12" fill="#FFFFFF" />

    <!-- Segment 2 -->
    <line x1="216" y1="300" x2="262" y2="274" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <!-- Node 3 -->
    <circle cx="262" cy="274" r="12" fill="#FFFFFF" />

    <!-- Segment 3 to Arrow Tip -->
    <line x1="262" y1="274" x2="330" y2="342" stroke="url(#arrowGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Arrow Head pointing bottom-right -->
    <polygon 
      points="348,360 312,354 342,324" 
      fill="url(#arrowGrad)" 
      stroke="url(#arrowGrad)" 
      stroke-width="4" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- 4. Notification Bell Badge on Upper Right -->
  <g filter="url(#shadow)">
    <!-- White Circular Badge -->
    <circle cx="380" cy="216" r="62" fill="#FFFFFF" />

    <!-- Ringing Wave Arc Left -->
    <path 
      d="M 346 200 A 24 24 0 0 0 346 232" 
      fill="none" 
      stroke="#FF3800" 
      stroke-width="6" 
      stroke-linecap="round" 
    />
    <!-- Ringing Wave Arc Right -->
    <path 
      d="M 414 200 A 24 24 0 0 1 414 232" 
      fill="none" 
      stroke="#FF3800" 
      stroke-width="6" 
      stroke-linecap="round" 
    />

    <!-- Bell Icon in Vibrant Orange -->
    <!-- Top Bell Loop -->
    <circle cx="380" cy="190" r="5" fill="#FF3800" />
    
    <!-- Bell Body -->
    <path 
      d="M 370 196 
         C 370 188 390 188 390 196 
         L 392 222 
         L 398 228 
         A 3 3 0 0 1 396 232 
         L 364 232 
         A 3 3 0 0 1 362 228 
         L 368 222 Z" 
      fill="#FF3800" 
    />

    <!-- Bell Clapper / Striker Ball -->
    <circle cx="380" cy="240" r="5" fill="#FF3800" />
  </g>
</svg>
