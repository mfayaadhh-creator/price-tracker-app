<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161F" />
      <stop offset="100%" stop-color="#080A0E" />
    </linearGradient>
    <linearGradient id="tagG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6200" />
      <stop offset="100%" stop-color="#EE2800" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>
  </defs>

  <!-- 1. Dark Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgG)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#242D3E" stroke-width="10" />

  <!-- 2. Price Tag (Classic horizontal tag, pointed tip on LEFT) -->
  <path
    d="M 72 256
       L 156 162
       A 16 16 0 0 1 170 156
       L 424 156
       A 20 20 0 0 1 444 176
       L 444 336
       A 20 20 0 0 1 424 356
       L 170 356
       A 16 16 0 0 1 156 350
       Z"
    fill="url(#tagG)"
    stroke="#FFFFFF"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Tag Eyelet (Hole near pointed tip) -->
  <circle cx="162" cy="256" r="22" fill="#080A0E" stroke="#FFFFFF" stroke-width="10" />

  <!-- 3. GREEN Downward Trend Arrow (Price Drop) -->
  <!-- Zigzag trend line clearly going DOWN like a stock chart -->
  <polyline
    points="240,200 286,256 326,216 396,310"
    fill="none"
    stroke="url(#greenG)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Arrowhead pointing clearly DOWN-RIGHT -->
  <polygon
    points="396,310 396,268 362,310"
    fill="url(#greenG)"
  />

  <!-- 4. Green Live Status Dot (top-right corner) -->
  <circle cx="440" cy="72" r="14" fill="url(#greenG)" stroke="#FFFFFF" stroke-width="4" />
</svg>
